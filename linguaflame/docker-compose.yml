version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: linguaflame-api
    restart: unless-stopped
    networks:
      - traefik-public
      - linguaflame-internal
    volumes:
      - sqlite_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Path=/app/data/linguaflame.db
      - Jwt__Secret=${JWT_SECRET} # Make sure to set this in your VPS environment
      - Jwt__Issuer=linguaflame
      - Jwt__Audience=linguaflame
      - Admin__Email=${ADMIN_EMAIL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linguaflame-api.rule=Host(`linguaflame.emirhantasci.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.linguaflame-api.entrypoints=websecure"
      - "traefik.http.routers.linguaflame-api.tls.certresolver=le" # Assuming 'le' is your Let's Encrypt resolver
      - "traefik.http.services.linguaflame-api.loadbalancer.server.port=8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: linguaflame-web
    restart: unless-stopped
    networks:
      - traefik-public
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linguaflame-web.rule=Host(`linguaflame.emirhantasci.cloud`)"
      - "traefik.http.routers.linguaflame-web.entrypoints=websecure"
      - "traefik.http.routers.linguaflame-web.tls.certresolver=le" # Assuming 'le' is your Let's Encrypt resolver
      - "traefik.http.services.linguaflame-web.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
  linguaflame-internal:
    internal: true

volumes:
  sqlite_data:
    driver: local
