version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: linguaflame-api
    restart: unless-stopped
    networks:
      - traefik-public
      - linguaflame-internal
    volumes:
      - sqlite_data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Path=/app/data/linguaflame.db
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=linguaflame
      - Jwt__Audience=linguaflame
      - Admin__Email=${ADMIN_EMAIL}
    labels:
      - "traefik.enable=true"
      # Çakışmayı önlemek için router ismini benzersiz yaptık
      - "traefik.http.routers.linguaflame-api-v1.rule=Host(`linguaflame.emirhantasci.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.linguaflame-api-v1.entrypoints=websecure"
      - "traefik.http.routers.linguaflame-api-v1.tls.certresolver=mytlschallenge" # Loglara göre düzeltildi
      - "traefik.http.routers.linguaflame-api-v1.priority=100"
      # Loglarda görünen gerçek port olan 5001'e yönlendirdik
      - "traefik.http.services.linguaflame-api-v1.loadbalancer.server.port=5001"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: linguaflame-web
    restart: unless-stopped
    networks:
      - traefik-public
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linguaflame-web-v1.rule=Host(`linguaflame.emirhantasci.cloud`)"
      - "traefik.http.routers.linguaflame-web-v1.entrypoints=websecure"
      - "traefik.http.routers.linguaflame-web-v1.tls.certresolver=mytlschallenge" # Loglara göre düzeltildi
      - "traefik.http.routers.linguaflame-web-v1.priority=10"
      - "traefik.http.services.linguaflame-web-v1.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
  linguaflame-internal:
    internal: true

volumes:
  sqlite_data:
    driver: local
