services:
  # ── Backend (.NET 8 + SQLite) ─────────────────────────────
  api:
    build: 
      context: .
      dockerfile: API/Dockerfile # Dockerfile yolunu projenize göre kontrol edin
    container_name: linguaflame_api
    volumes:
      - api-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Path=/app/data/linguaflame.db
      - Jwt__Secret=SeninCokGizliSifren123! # Buraya sabit bir string veya panelden env ekle
      - Jwt__Issuer=linguaflame
      - Jwt__Audience=linguaflame
      - Jwt__ExpiresHours=720
      - Cors__Origins__0=https://linguaflame.emirhantasci.cloud
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"] # .NET 8 genelde 8080 kullanır
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Nginx + React) ──────────────────────────────
  web:
    build:
      context: .
      dockerfile: UI/Dockerfile # Dockerfile yolunu projenize göre kontrol edin
    container_name: linguaflame_web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net
    # Hostinger Traefik Yapılandırması
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linguaflame.rule=Host(`linguaflame.emirhantasci.cloud`)"
      - "traefik.http.routers.linguaflame.entrypoints=websecure"
      - "traefik.http.routers.linguaflame.tls.certresolver=myresolver"

volumes:
  api-data:
    driver: local

networks:
  app-net:
    driver: bridge